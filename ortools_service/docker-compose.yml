services:
  ortools-service:
    build: .
    container_name: ortools-service
    restart: always
    ports:
      # Solo localhost: el acceso externo entra por nginx (HTTPS) que hace
      # proxy a 127.0.0.1:18080. Nunca exponer este puerto directo a internet.
      # 18080 (no estándar) evita colisiones con otros servicios del VPS.
      - "127.0.0.1:18080:8000"
    env_file:
      - .env
